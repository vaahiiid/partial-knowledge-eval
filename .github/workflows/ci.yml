name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v

      # Runs the task end to end against inspect's mock model: checks the
      # dataset loads and the solver/scorer are wired up. No API keys, no cost.
      - name: Smoke-test eval
        run: >
          uv run inspect eval partial_knowledge.py
          --model mockllm/model -T judge=mockllm/model
          --limit 2 --log-dir ${{ runner.temp }}/inspect-logs
