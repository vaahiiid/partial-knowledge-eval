[project]
name = "partial-knowledge-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vahid Mohammadi", email = "170665400+vaahiiid@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.263",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
